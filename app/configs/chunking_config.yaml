# Chunking Configurations
general:
  chunk_size: 500
  chunk_overlap: 50

strategies:
  company_profiles:
    mode: "row-per-company"
    chunk_size: 1  # 1 row = 1 chunk
  interview_experiences:
    mode: "semantic"
    chunk_size: 300
    chunk_overlap: 30
  statistics:
    mode: "full-table"
  temporal_trends:
    mode: "row-per-company-per-year"
  conflicting_records:
    mode: "keep-both-flag-conflict"
