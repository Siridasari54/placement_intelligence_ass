# Model Configuration
llm:
  provider: "groq"
  default_model: "llama3-70b-8192"
  alternative_model: "mixtral-8x7b-32768"
  temperature: 0.1
  max_tokens: 1024
  timeout: 30.0

embeddings:
  provider: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu" # Options: cpu, cuda
